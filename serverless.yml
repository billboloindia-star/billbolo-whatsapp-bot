service: billbolo-whatsapp-bot

provider:
  name: aws
  profile: billbolo
  runtime: python3.12
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 29

  httpApi:
    cors: true

  environment:
    STAGE: ${self:provider.stage}
    DYNAMODB_TABLE: billbolo-state-${self:provider.stage}
    APP_TABLE: billbolo-app-${self:provider.stage}
    S3_BUCKET: billbolo-pdfs-${self:provider.stage}
    JWT_SECRET: ${env:JWT_SECRET}
    WHATSAPP_API_URL: https://graph.facebook.com/v21.0
    WHATSAPP_API_TOKEN: ${env:WHATSAPP_API_TOKEN}
    WHATSAPP_BUSINESS_ACCOUNT_ID: ${env:WHATSAPP_BUSINESS_ACCOUNT_ID}
    WHATSAPP_PHONE_NUMBER_ID: ${env:WHATSAPP_PHONE_NUMBER_ID}
    WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${env:WHATSAPP_WEBHOOK_VERIFY_TOKEN}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    SARVAM_API_KEY: ${env:SARVAM_API_KEY}
    CASHFREE_API_KEY: ${env:CASHFREE_API_KEY}
    CASHFREE_SECRET_KEY: ${env:CASHFREE_SECRET_KEY}
    CASHFREE_WEBHOOK_SECRET: ${env:CASHFREE_WEBHOOK_SECRET}
    GOOGLE_SHEETS_CREDENTIALS_JSON: ${env:GOOGLE_SHEETS_CREDENTIALS_JSON}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.DYNAMODB_TABLE}

        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.APP_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.APP_TABLE}/index/*

        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:provider.environment.S3_BUCKET}/*

        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${aws:region}:${aws:accountId}:*

package:
  patterns:
    - '!.venv/**'
    - '!.venv312/**'
    - '!node_modules/**'
    - '!.git/**'
    - '!.serverless/**'
    - '!scripts/**'
    - '!assets/**'
    - '!*.html'
    - '!*.css'
    - '!*.js'
    - '!*.pdf'
    - '!README.md'
    - '!.nvmrc'
    - 'src/**'

functions:
  app:
    handler: src/main.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY

# Resources temporarily removed for debugging - will create manually

plugins:
  - serverless-dotenv-plugin
  - serverless-python-requirements

custom:
  dotenv:
    exclude:
      - AWS_REGION
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true
    strip: true
    useDownloadCache: true
    useStaticCache: true
    noDeploy:
      - boto3
      - botocore
      - s3transfer
      - jmespath
