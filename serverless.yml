service: billbolo-whatsapp-bot

provider:
  name: aws
  runtime: python3.12
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 29

  environment:
    STAGE: ${self:provider.stage}
    DYNAMODB_TABLE: billbolo-state-${self:provider.stage}
    S3_BUCKET: billbolo-pdfs-${self:provider.stage}
    WHATSAPP_API_URL: https://graph.instagram.com/v18.0

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.DYNAMODB_TABLE}

        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:provider.environment.S3_BUCKET}/*

        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${aws:region}:${aws:accountId}:*

functions:
  webhook:
    handler: src/handlers/webhook.handler
    events:
      - http:
          path: webhook
          method: get
          cors: true
      - http:
          path: webhook
          method: post
          cors: true

  payments:
    handler: src/handlers/payments.handler
    events:
      - http:
          path: payments/webhook
          method: post
          cors: true

# Resources temporarily removed for debugging - will create manually

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true
    strip: false
    useDownloadCache: true
    useStaticCache: true
